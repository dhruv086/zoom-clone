services:
  - type: web
    name: zoom-backend
    runtime: python
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "cd backend && gunicorn zoom_clone.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DJANGO_SETTINGS_MODULE
        value: "zoom_clone.settings"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://zoom-frontend-znn0.onrender.com,http://localhost:3000"
      - key: FRONTEND_URL
        value: "https://zoom-frontend-znn0.onrender.com"
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_WS_URL
        value: "wss://your-livekit-server.example.com"
      - key: NEXT_PUBLIC_API_URL
        value: "https://zoom-backend-znn0.onrender.com/api"
      - key: NEXT_PUBLIC_WS_URL
        value: "wss://zoom-backend-znn0.onrender.com"

  - type: web
    name: zoom-frontend
    runtime: node
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    startCommand: "cd frontend && npm run start"
    envVars:
      - key: NODE_VERSION
        value: "20.11.1"
      - key: NEXT_PUBLIC_API_URL
        value: "https://zoom-backend-znn0.onrender.com/api"
      - key: NEXT_PUBLIC_WS_URL
        value: "wss://zoom-backend-znn0.onrender.com"
      - key: NEXT_PUBLIC_FRONTEND_URL
        value: "https://zoom-frontend-znn0.onrender.com"
