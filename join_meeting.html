<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Join Meeting - ConnectPro</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-primary-container": "#ecedff",
                    "surface-container-lowest": "#ffffff",
                    "surface-container-high": "#e8e8e8",
                    "surface": "#f9f9f9",
                    "surface-container-highest": "#e2e2e2",
                    "on-background": "#1a1c1c",
                    "primary-fixed": "#dce1ff",
                    "background": "#f9f9f9",
                    "error": "#ba1a1a",
                    "on-secondary-container": "#fefcff",
                    "surface-dim": "#dadada",
                    "on-error-container": "#93000a",
                    "outline": "#737688",
                    "on-primary": "#ffffff",
                    "secondary": "#005bb2",
                    "on-tertiary-fixed": "#1a1a2a",
                    "surface-variant": "#e2e2e2",
                    "primary-fixed-dim": "#b5c4ff",
                    "surface-container": "#eeeeee",
                    "on-tertiary-fixed-variant": "#464557",
                    "on-primary-fixed-variant": "#003baf",
                    "on-secondary-fixed-variant": "#00468b",
                    "on-error": "#ffffff",
                    "primary-container": "#0b5cff",
                    "on-tertiary": "#ffffff",
                    "on-primary-fixed": "#00164e",
                    "error-container": "#ffdad6",
                    "surface-tint": "#0050e4",
                    "tertiary": "#525264",
                    "primary": "#0046cc",
                    "tertiary-container": "#6b6a7d",
                    "inverse-on-surface": "#f1f1f1",
                    "on-surface": "#1a1c1c",
                    "on-secondary-fixed": "#001b3d",
                    "outline-variant": "#c3c5d9",
                    "surface-bright": "#f9f9f9",
                    "on-secondary": "#ffffff",
                    "inverse-primary": "#b5c4ff",
                    "secondary-fixed-dim": "#a9c7ff",
                    "secondary-container": "#0073de",
                    "surface-container-low": "#f3f3f3",
                    "secondary-fixed": "#d6e3ff",
                    "on-tertiary-container": "#efecff",
                    "on-surface-variant": "#434656",
                    "tertiary-fixed-dim": "#c6c4da",
                    "tertiary-fixed": "#e3e0f6",
                    "inverse-surface": "#2f3131"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "xs": "4px",
                    "gutter": "20px",
                    "container-max": "1280px",
                    "base": "8px",
                    "sm": "12px",
                    "xl": "32px",
                    "md": "16px",
                    "lg": "24px"
            },
            "fontFamily": {
                    "label-sm": ["Inter"],
                    "headline-lg": ["Inter"],
                    "body-lg": ["Inter"],
                    "label-md": ["Inter"],

            "fontSize": {

                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "label-md": ["14px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],

                    "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],

        },

<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(229, 229, 229, 0.5);
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.08);
        }
    </style>
</head>
<body class="bg-background min-h-screen font-sans antialiased text-on-surface flex flex-col">
<!-- TopNavBar (Nav Shell excluded as per instructions for linear/transactional intent, but keeping a minimal brand header for context if needed, though instructions suggest suppressing nav shell. I will suppress the full TopAppBar and SideNav as this is a focused task, and instead just present the centered modal.) -->
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center p-md sm:p-xl w-full h-full relative overflow-hidden bg-surface-container-low">
<!-- Subtle decorative background element -->
<div class="absolute inset-0 opacity-20 pointer-events-none" style="background-image: radial-gradient(circle at 50% 0%, var(--tw-colors-primary-fixed-dim) 0%, transparent 70%);"></div>
<!-- Join Meeting Modal -->
<div class="glass-panel w-full max-w-[480px] rounded-xl p-xl flex flex-col gap-lg relative z-10 animate-fade-in-up">
<div class="text-center flex flex-col gap-xs">
<h1 class="text-headline-md font-headline-md text-on-surface">Join Meeting</h1>
<p class="text-body-sm font-body-sm text-on-surface-variant">ConnectPro Video Conferencing</p>
</div>
<form class="flex flex-col gap-md">
<!-- Input Group -->
<div class="flex flex-col gap-sm">
<div class="flex flex-col gap-xs">
<label class="text-label-sm font-label-sm text-on-surface-variant uppercase tracking-wider" for="meeting-id">Meeting ID or Personal Link Name</label>
<input class="w-full h-12 px-sm py-xs border border-outline-variant rounded bg-surface-container-lowest text-body-md font-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all shadow-sm" id="meeting-id" placeholder="Enter Meeting ID" type="text"/>
</div>
<div class="flex flex-col gap-xs">
<label class="text-label-sm font-label-sm text-on-surface-variant uppercase tracking-wider" for="user-name">Your Name</label>
<input class="w-full h-12 px-sm py-xs border border-outline-variant rounded bg-surface-container-lowest text-body-md font-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all shadow-sm" id="user-name" placeholder="Enter your name" type="text"/>
</div>
</div>
<!-- Settings Toggles -->
<div class="flex flex-col gap-base bg-surface p-sm rounded-lg border border-surface-container-highest mt-sm">
<label class="flex items-center gap-sm cursor-pointer group">
<div class="relative flex items-center justify-center">
<input checked="" class="peer sr-only" type="checkbox"/>
<div class="w-5 h-5 rounded border border-outline-variant bg-surface-container-lowest peer-checked:bg-primary peer-checked:border-primary transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-[16px] text-on-primary opacity-0 peer-checked:opacity-100 transition-opacity" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
<span class="text-body-sm font-body-sm text-on-surface group-hover:text-primary transition-colors select-none">Remember my name for future meetings</span>
</label>
<label class="flex items-center gap-sm cursor-pointer group">
<div class="relative flex items-center justify-center">
<input class="peer sr-only" type="checkbox"/>
<div class="w-5 h-5 rounded border border-outline-variant bg-surface-container-lowest peer-checked:bg-primary peer-checked:border-primary transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-[16px] text-on-primary opacity-0 peer-checked:opacity-100 transition-opacity" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
<span class="text-body-sm font-body-sm text-on-surface group-hover:text-primary transition-colors select-none">Don't connect to audio</span>
</label>
<label class="flex items-center gap-sm cursor-pointer group">
<div class="relative flex items-center justify-center">
<input class="peer sr-only" type="checkbox"/>
<div class="w-5 h-5 rounded border border-outline-variant bg-surface-container-lowest peer-checked:bg-primary peer-checked:border-primary transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-[16px] text-on-primary opacity-0 peer-checked:opacity-100 transition-opacity" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
<span class="text-body-sm font-body-sm text-on-surface group-hover:text-primary transition-colors select-none">Turn off my video</span>
</label>
</div>
<!-- Actions -->
<div class="flex flex-col gap-sm mt-md">
<button class="w-full h-12 bg-primary hover:bg-surface-tint text-on-primary text-label-md font-label-md rounded flex items-center justify-center transition-colors shadow-sm active:scale-[0.98]" type="button">
                        Join
                    </button>
<button class="w-full h-12 bg-transparent border border-outline-variant text-on-surface-variant hover:bg-surface-container hover:text-on-surface text-label-md font-label-md rounded flex items-center justify-center transition-colors" type="button">
                        Cancel
                    </button>
</div>
</form>
</div>
</main>
<style>
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.4s ease-out forwards;
        }
    </style>
</body></html>
