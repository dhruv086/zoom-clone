<!-- Topic & Description -->
<div class="grid grid-cols-1 md:grid-cols-[200px_1fr] gap-md md:gap-xl items-start">
<label class="text-label-md font-label-md text-on-surface-variant pt-sm" for="topic">Topic</label>
<div class="flex flex-col gap-xs">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm text-body-md font-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all" id="topic" type="text" value="My Meeting"/>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-[200px_1fr] gap-md md:gap-xl items-start">
<label class="text-label-md font-label-md text-on-surface-variant pt-sm" for="description">Description <span class="text-label-sm font-normal">(Optional)</span></label>
<div class="flex flex-col gap-xs">
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm text-body-md font-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all resize-y" id="description" rows="3"></textarea>
</div>
</div>
<hr class="border-outline-variant border-t"/>
<!-- Time & Date -->
<div class="grid grid-cols-1 md:grid-cols-[200px_1fr] gap-md md:gap-xl items-start">
<label class="text-label-md font-label-md text-on-surface-variant pt-sm">When</label>
<div class="flex flex-col gap-md">
<div class="flex flex-wrap items-center gap-sm">
<input class="bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm text-body-md font-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all" type="date" value="2023-11-01"/>
<input class="bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm text-body-md font-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all" type="time" value="14:00"/>
</div>
<div class="flex items-center gap-sm">
<span class="text-body-sm font-body-sm text-on-surface-variant">Duration:</span>
<select class="bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm text-body-md font-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all">
<option>0</option>
<option selected="">1</option>
<option>2</option>
<option>3</option>
</select>
<span class="text-body-sm font-body-sm text-on-surface-variant">hr</span>
<select class="bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm text-body-md font-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all">
<option selected="">0</option>
<option>15</option>
<option>30</option>
<option>45</option>
</select>
<span class="text-body-sm font-body-sm text-on-surface-variant">min</span>
</div>
<div class="mt-sm">
<select class="w-full max-w-xs bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm text-body-md font-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all">
<option>(GMT-08:00) Pacific Time (US and Canada)</option>
<option>(GMT-05:00) Eastern Time (US and Canada)</option>
<option>(GMT+00:00) London</option>
</select>
</div>
</div>
</div>
<hr class="border-outline-variant border-t"/>

<div class="flex flex-col gap-sm pt-sm">
<label class="flex items-center gap-base cursor-pointer">
<input checked="" class="w-4 h-4 text-primary bg-surface border-outline-variant focus:ring-primary focus:ring-2" name="meeting_id" type="radio"/>
<span class="text-body-md font-body-md text-on-surface">Generate Automatically</span>
</label>
<label class="flex items-center gap-base cursor-pointer">
<input class="w-4 h-4 text-primary bg-surface border-outline-variant focus:ring-primary focus:ring-2" name="meeting_id" type="radio"/>
<span class="text-body-md font-body-md text-on-surface">Personal Meeting ID <span class="text-on-surface-variant ml-xs">(123 456 7890)</span></span>
</label>

<div>

<input class="bg-surface-container-low border border-outline-variant rounded-md px-sm py-xs text-body-sm font-body-sm text-on-surface-variant w-24 focus:outline-none focus:ring-2 focus:ring-primary" type="text" value="rA7b9z"/>
</div>
</div>
</label>
<label class="flex items-start gap-base cursor-pointer">
<input checked="" class="mt-1 w-4 h-4 text-primary bg-surface border-outline-variant rounded focus:ring-primary focus:ring-2" type="checkbox"/>
<div>
<span class="text-body-md font-body-md text-on-surface block">Waiting Room</span>
<span class="text-body-sm font-body-sm text-on-surface-variant block mt-xs">Only users admitted by the host can join the meeting.</span>
</div>
</label>
</div>
</div>
<hr class="border-outline-variant border-t"/>

<label class="flex items-center gap-base cursor-pointer">
<input class="w-4 h-4 text-primary bg-surface border-outline-variant focus:ring-primary focus:ring-2" name="video_host" type="radio"/>

</label>
<label class="flex items-center gap-base cursor-pointer">
<input checked="" class="w-4 h-4 text-primary bg-surface border-outline-variant focus:ring-primary focus:ring-2" name="video_host" type="radio"/>
<span class="text-body-md font-body-md text-on-surface">Off</span>
</label>
</div>
<div class="flex items-center gap-xl mt-sm">
<span class="text-body-sm font-body-sm text-on-surface-variant w-24">Participants</span>
<label class="flex items-center gap-base cursor-pointer">
<input class="w-4 h-4 text-primary bg-surface border-outline-variant focus:ring-primary focus:ring-2" name="video_participants" type="radio"/>
<span class="text-body-md font-body-md text-on-surface">On</span>
</label>
<label class="flex items-center gap-base cursor-pointer">
<input checked="" class="w-4 h-4 text-primary bg-surface border-outline-variant focus:ring-primary focus:ring-2" name="video_participants" type="radio"/>
<span class="text-body-md font-body-md text-on-surface">Off</span>
</label>
</div>
</div>

<span class="text-body-md font-body-md text-on-surface">Telephone</span>

<label class="flex items-center gap-base cursor-pointer">

<label class="flex items-center gap-base cursor-pointer">
<input checked="" class="w-4 h-4 text-primary bg-surface border-outline-variant focus:ring-primary focus:ring-2" name="audio_type" type="radio"/>

</div>
</div>
